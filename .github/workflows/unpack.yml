name: Unpack bundle (one-time)
on:
  push:
    paths: ['.github/workflows/unpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          test -f bundle.zip || exit 0
          rm -f README.md
          unzip -o bundle.zip -x '.github/*'
          rm bundle.zip
          git config user.name finder-bot
          git config user.email finder-bot@users.noreply.github.com
          git add -A
          git commit -m 'Unpack project files'
          git push
